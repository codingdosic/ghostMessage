spring:
  application:
    name: ghostMessage # 프로젝트 이름

  datasource: # DB 접속 정보
    url: jdbc:postgresql://db:5432/ghost_db
    username: ghost_user # 본인의 DB 계정 ID
    password: 1 # 본인의 DB 계정 PW
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: redis
      port: 6379

  cache:
    type: redis

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: never

  flyway:
    enabled: false

  management:
    endpoints:
      web:
        exposure:
          include: health, info, prometheus
    endpoint:
      prometheus:
        enabled: true
      health:
        show-details: always
