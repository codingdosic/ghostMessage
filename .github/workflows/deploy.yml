name: GhostMessage CI/CD (GHCR Standard)

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'ghostMessage_server/**'
      - '.github/workflows/deploy.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ghost-message-server
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./ghostMessage_server
          file: ghostMessage_server/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync deployment config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "ghostMessage_server/docker-compose.yml,ghostMessage_server/nginx/ghostmessage.conf"
          target: "/home/ubuntu/app/ghostMessage_server"
          strip_components: 1

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -e
            cd ~/app/ghostMessage_server

            echo "Logging in to GHCR (if GHCR_PAT is configured)..."
            if [ -n "${{ secrets.GHCR_PAT }}" ]; then
              echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            fi

            echo "Pulling latest image: ghcr.io/${{ github.repository_owner }}/ghost-message-server:latest"
            docker compose pull app

            echo "Restarting app container..."
            docker compose up -d app

            sudo install -m 644 nginx/ghostmessage.conf /etc/nginx/sites-available/ghostmessage.conf
            sudo nginx -t
            sudo systemctl reload nginx

            echo "Deployment command completed."
