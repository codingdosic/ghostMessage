name: GhostMessage CI/CD (GHCR Standard)

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'ghostMessage_server/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ghost-message-server
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build and test with Gradle
        working-directory: ./ghostMessage_server
        run: |
          chmod +x ./gradlew
          ./gradlew clean build

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./ghostMessage_server
          file: ghostMessage_server/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "ghostMessage_server/docker-compose.yml"
          target: "/home/ubuntu/app/ghostMessage_server"
          strip_components: 1

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/app/ghostMessage_server

            echo "Logging in to GHCR (if GHCR_PAT is configured)..."
            if [ -n "${{ secrets.GHCR_PAT }}" ]; then
              echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            fi

            echo "Pulling latest image: ghcr.io/${{ github.repository_owner }}/ghost-message-server:latest"
            docker compose pull app

            echo "Restarting app container..."
            docker compose up -d app

            echo "Waiting for health check..."
            HEALTH_OK=false
            APP_NETWORK=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' ghost-app)
            for i in $(seq 1 30); do
              if docker run --rm --network "$APP_NETWORK" curlimages/curl:8.5.0 \
                -sf http://app:8080/actuator/health | grep -q '"status":"UP"'; then
                HEALTH_OK=true
                break
              fi
              sleep 2
            done

            if [ "$HEALTH_OK" = false ]; then
              echo "Health check failed after 60s"
              docker compose logs app --tail 80
              exit 1
            fi

            docker image prune -f
            echo "Deployment successful!"
